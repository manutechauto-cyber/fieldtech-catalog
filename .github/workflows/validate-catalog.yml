name: Validate FieldTech Catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_sensor_structure.py
      - run: python scripts/validate_catalog.py
      - run: python scripts/build_distribution.py --check
      - run: python scripts/build_sensor_distribution.py --check
      - run: python scripts/build_cloud_database.py --check
      - run: python -m unittest discover -s tests -v
