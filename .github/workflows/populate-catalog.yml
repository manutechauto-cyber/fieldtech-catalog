name: Populate FieldTech Catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog_bundle.b64'
      - '.github/workflows/populate-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and validate catalog bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, pathlib, zipfile
          raw = pathlib.Path('catalog_bundle.b64').read_text()
          data = base64.b64decode(''.join(raw.split()))
          z = zipfile.ZipFile(io.BytesIO(data))
          bad = z.testzip()
          if bad:
              raise SystemExit(f'Corrupt ZIP entry: {bad}')
          z.extractall('.')
          print(f'Extracted {len(z.namelist())} catalog files')
          PY
      - name: Validate manifest and packs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path('manifest.json').read_text())
          assert m['catalogVersion'] == 4
          assert 'it' in m.get('languages', [])
          assert len(m['packs']) == 22
          for item in m['packs']:
              rel = item['url'].split('/main/', 1)[1]
              p = pathlib.Path(rel)
              assert p.exists(), rel
              data = json.loads(p.read_text())
              assert data['packId'] == item['packId']
              assert data['version'] == 4
              assert data.get('parameters'), rel + ' has no parameters'
              assert data.get('faults'), rel + ' has no faults'
              for fault in data['faults']:
                  assert 'it' in fault.get('title', {}), rel + ' fault missing it title'
              for par in data['parameters']:
                  assert 'it' in par.get('name', {}), rel + ' parameter missing it name'
          print('Validated 22 drive packs v4 with Italian localization')
          PY
      - name: Commit generated catalog
        shell: bash
        run: |
          rm -f _staging_test.tmp
          git config user.name 'FieldTech Catalog Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manifest.json siemens rockwell danfoss weg sew abb schneider
          git rm -f --ignore-unmatch _staging_test.tmp
          if git diff --cached --quiet; then
            echo 'Catalog already up to date.'
            exit 0
          fi
          git commit -m 'Expand FieldTech drive packs v4 with Italian localization'
          git push
