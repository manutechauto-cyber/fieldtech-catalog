name: Populate FieldTech Catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog_bundle.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and validate catalog bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, pathlib, zipfile
          raw = pathlib.Path('catalog_bundle.b64').read_text()
          data = base64.b64decode(''.join(raw.split()))
          z = zipfile.ZipFile(io.BytesIO(data))
          bad = z.testzip()
          if bad:
              raise SystemExit(f'Corrupt ZIP entry: {bad}')
          z.extractall('.')
          print(f'Extracted {len(z.namelist())} catalog files')
          PY
      - name: Validate manifest and packs
        shell: bash
        run: |
          python3 scripts/validate_catalog.py
      - name: Commit generated catalog
        shell: bash
        run: |
          rm -f _staging_test.tmp
          git config user.name 'FieldTech Catalog Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manifest.json
          python3 - <<'PY'
          import json, subprocess
          paths = [item["url"].split("/main/", 1)[1] for item in json.load(open("manifest.json"))["packs"]]
          subprocess.run(["git", "add", "--", *paths], check=True)
          PY
          git rm -f --ignore-unmatch _staging_test.tmp
          if git diff --cached --quiet; then
            echo 'Catalog already up to date.'
            exit 0
          fi
          git commit -m 'Populate validated FieldTech catalog bundle'
          git push
